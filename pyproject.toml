[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parity-posttrain"
version = "0.1.0"
description = "A benchmark for agentic rollout-trainer alignment and post-training infrastructure."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Wenqian Weng", email = "wenqianweng18@gmail.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10"
]
distributed = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1",
    "grpcio>=1.70,<2",
    "grpcio-tools>=1.70,<2",
    "aiokafka>=0.12,<1",
    "httpx>=0.28,<1",
]
ml = [
    "torch>=2.6,<3",
    "transformers>=4.51,<6",
    "safetensors>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "enterprise_eval/distributed/proto/control_plane_pb2*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
